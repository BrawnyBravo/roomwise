---
name: Release

# Lifted shamelessly from https://github.com/custom-components/grocy

on:
  release:
    types: [published]
  # Called by publish-release.yaml, whose own release does not trigger this file.
  workflow_call:
    inputs:
      tag_name:
        description: Tag of the published release to build for
        required: true
        type: string

permissions: {}

jobs:
  release_zip_file:
    name: Prepare and upload release asset
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    env:
      ROOMWISE_ROOT_DIR: "${{ github.workspace }}/custom_components/roomwise"
      RELEASE_TAG: "${{ inputs.tag_name || github.event.release.tag_name }}"
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Set release version number in files
        shell: bash
        run: |
          version="${RELEASE_TAG}"
          version="${version,,}"
          version="${version#v}"
          # update const.py
          sed -i \
            "/^VERSION.*=./c\VERSION = \"${version}\"" \
            "${{ env.ROOMWISE_ROOT_DIR }}/const.py"
          # update manifest.json
          jq ".version = \"${version}\"" "${{ env.ROOMWISE_ROOT_DIR }}/manifest.json" > "${{ env.ROOMWISE_ROOT_DIR }}/manifest.json.tmp"
          mv "${{ env.ROOMWISE_ROOT_DIR }}/manifest.json.tmp" "${{ env.ROOMWISE_ROOT_DIR }}/manifest.json"

      - name: Zip the integration directory
        run: |
          cd "${{ env.ROOMWISE_ROOT_DIR }}"
          zip roomwise.zip -r ./

      - name: 🔏 Sign release package
        uses: sigstore/gh-action-sigstore-python@v3.5.0
        with:
          inputs: "${{ env.ROOMWISE_ROOT_DIR }}/roomwise.zip"

      - name: "Upload the ZIP file to the release"
        uses: softprops/action-gh-release@v3.0.3
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          # The signing step only attaches its own files on a release event, so the
          # one-click path needs the signature uploaded here.
          files: |
            ${{ env.ROOMWISE_ROOT_DIR }}/roomwise.zip
            ${{ env.ROOMWISE_ROOT_DIR }}/roomwise.zip.sigstore.json
